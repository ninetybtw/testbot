name = "astra-bot"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Хранилище карточек клиентов. При первом `npx wrangler deploy` Cloudflare создаст его сам.
[[kv_namespaces]]
binding = "LEADS"

[vars]
TIMEZONE = "Europe/Moscow"
# Куда присылать уведомления о новых лидах (узнать ID: написать боту /id):
# ADMIN_CHAT_ID = "123456789"
# Свой текст предложения платного разбора в конце прогноза:
# UPSELL_TEXT = "Хотите полный разбор на год? Нажмите «Хочу полный разбор»."

# Секреты задаются командами, а не здесь:
#   npx wrangler secret put BOT_TOKEN   — токен от @BotFather
#   npx wrangler secret put ADMIN_KEY   — пароль для страниц /setup и /crm
